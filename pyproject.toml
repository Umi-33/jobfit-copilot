[project]
name = "jobfit-copilot"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]",
    "openai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend.tests*", "frontend*"]
namespaces = true

[tool.fastapi]
entrypoint = "backend.app.main:app"
